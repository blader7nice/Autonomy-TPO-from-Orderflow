# FLOWLEVELS versioned config. Bump `version` on any change that affects results.
# The config hash (flowlevels.config.config_hash) is recorded in every report.
version: 3

symbols:
  BTCUSDT:
    exchange_tick: 0.1
    bucket: 10.0     # footprint bucket, USD (see docs/DECISIONS.md D-004)
    tpo_tick: 10.0
  ETHUSDT:
    exchange_tick: 0.01
    bucket: 0.5
    tpo_tick: 0.5

retention:
  raw_live_ticks_days: 7
  footprint_1m_days: 30

footprint:
  imb_ratio: 3.0
  imb_min_volume: 0.0
  stack_n: 3
  baseline_days: 20
  baseline_slot_minutes: 30
  baseline_min_samples: 5

levels:
  tpo_period_minutes: 30
  value_area_pct: 0.70
  naked_poc_lookback_days: 10
  # HVN/LVN (v2, D-028): peaks/valleys of the smoothed volume profile ranked by prominence,
  # at least hvn_min_distance_k_atr x ATR(1h at session start) apart, top N of each kind.
  hvn_smoothing_rows: 5
  hvn_min_prominence: 0.05     # fraction of the smoothed profile max
  hvn_min_distance_k_atr: 0.5
  hvn_top_n: 3
  lvn_top_n: 3
  atr_period_1h: 14
  # Confluence (v2, D-029): clusters anchored on their strongest member, members within
  # confluence_k_atr x ATR of the anchor, hard cap on zone width (incl. tolerance).
  confluence_k_atr: 0.25
  zone_tolerance_k_atr: 0.10
  zone_max_width_k_atr: 0.5
  weights: {}        # level_type -> weight; default 1.0

data_quality:
  # aggTrade ids can be contiguous across a hole in the data (2026-10-27 00:02:46-00:30:05
  # UTC, docs/DATA_SOURCES.md), so time silences are checked as well (D-026).
  max_trade_silence_s: 60
  # Fill holes from the raw per-fill `trades` archive, verified against 1m klines; holes that
  # cannot be filled stay excluded (D-031). Owner decision 2026-11-27 (D-032).
  repair_holes_from_trades: true

costs:
  # Signals come from Binance USD-M; trades are executed on OKX EEA inverse perpetuals
  # BTC-USD-SWAP / ETH-USD-SWAP with USDC collateral (owner, 2026-11-27, D-033). Fees are
  # fractions of notional per side. Sources: docs/DATA_SOURCES.md.
  fee_profile: okx_eu_inverse
  fee_profiles:
    okx_eu_inverse:
      venue: OKX EEA
      tier: Owner account, BTC-USD-SWAP / ETH-USD-SWAP
      maker_fee: 0.0002
      taker_fee: 0.0005
      as_of: "2026-11-27"
      source: UNCONFIRMED placeholder = OKX regular-tier rates until the owner gives the account's actual rates (D-033)
    okx_regular:
      venue: OKX
      tier: Regular user (non-VIP), futures/perpetual swaps
      maker_fee: 0.0002
      taker_fee: 0.0005
      as_of: "2026-11-26"
      source: OKX notice 2026-03-24 (effective 2026-04-08), DATA_SOURCES.md "OKX fees"
    binance_regular:
      venue: Binance
      tier: Regular user (VIP 0), USD-M futures, no BNB discount
      maker_fee: 0.0002
      taker_fee: 0.0005
      as_of: "2025"
      source: prior knowledge, UNVERIFIED (DATA_SOURCES.md "Binance fees")
  # Adverse slippage per side. Default 1 footprint bucket (owner, 2026-11-27): 10 USD BTC,
  # 0.5 USD ETH. The OKX tick scenarios are optimistic sensitivities (2 ticks = 0.2 USD BTC).
  slippage: bucket1
  slippage_scenarios:
    bucket1: {unit: bucket, amount: 1}
    okx_2tick: {unit: exec_tick, amount: 2}
    okx_4tick: {unit: exec_tick, amount: 4}
  execution_instruments:
    BTCUSDT:
      venue: OKX EEA
      inst_id: BTC-USD-SWAP
      contract_type: inverse
      contract_value: 100
      contract_value_ccy: USD
      settle_ccy: BTC
      tick: 0.1
      min_size_contracts: 0.1
      status: confirmed by owner
      as_of: "2026-11-27"
      source: eea.okx.com /api/v5/public/instruments (DATA_SOURCES.md)
    ETHUSDT:
      venue: OKX EEA
      inst_id: ETH-USD-SWAP
      contract_type: inverse
      contract_value: 10
      contract_value_ccy: USD
      settle_ccy: ETH
      tick: 0.01
      min_size_contracts: 1
      status: confirmed by owner
      as_of: "2026-11-27"
      source: eea.okx.com /api/v5/public/instruments (DATA_SOURCES.md)

# ---- Phase 3 (config v3). Defaults fixed before any outcome was seen (D-035).
signals:
  resolutions: [1m, 3m, 5m, 15m]
  primary_resolution: 5m
  window_bars: 4
  score_threshold: 1.0
  weights: {absorption: 1.0, exhaustion: 1.0, delta_divergence: 1.0, stacked_imbalance: 1.0, trapped: 1.0}
  absorption: {vol_z_min: 1.5, delta_frac_min: 0.15, close_pos_min: 0.5}
  exhaustion: {extreme_frac_max: 0.10, min_buckets: 3, close_pos_min: 0.5, lookback_bars: 3}
  delta_divergence: {lookback_bars: 3}
  trapped: {delta_z_min: 1.5, close_pos_max: 0.33}
  dynamic_min_minutes: 30

context:
  lookback_h: 24
  trend_k_atr: 2.0

trade_model:
  stop_buffer_ticks: 2
  min_stop_k_atr: 0.1
  targets_r: [1.0, 2.0, 3.0]
  max_hold_minutes: 240
  primary_exit: 2R

research:
  tuning_days: 60
  holdout_days: 274
  grid_window_bars: [2, 4, 6]
  grid_score_threshold: [1.0, 2.0, 3.0]
  min_n_per_group: 30
  bootstrap_reps: 2000
  ci_level: 0.90
  power: 0.80
  seed: 42
  gate_uplift_r: 0.15

# ---- ITERATION-1 (DECISIONS "ITERATION-1", pre-registered 2026-11-27). Level-to-level trades.
iteration1:
  resolution: 5m
  grid_score_threshold: [2.0, 3.0]
  grid_window_bars: [2, 3]
  grid_min_stop_k_atr: [0.5, 0.75, 1.0]
  min_stop_cost_mult: 3.0       # minimum stop >= 3 x round-trip cost (default scenario)
  min_target_r: 1.5             # take the trade only if target distance >= 1.5 x stop
  time_stop_bars: 48            # 48 x 5m = 4 h
  first_touch_only: true
  min_zone_score: 1.0           # frozen in-sample median (2026-11-27, zones only; D-037)
  min_treatment_trades: 100
  secondary_exits: [2R, 3R]

# ---- Owner's Supply Zone bot (docs/strategies/SUPPLY_ZONE_SPEC.md). Values = live code.
supply_zone:
  n_1h: 300
  n_4h: 150
  min_1h: 100
  min_4h: 50
  scan_delay_s: 180            # emulated scan at HH:03 (median live delay, A1)
  regime_ema_fast: 20
  regime_ema_slow: 50
  regime_slope_bars: 10
  regime_slope_threshold: 0.05 # BTC/ETH
  regime_threshold_default: 0.1  # code default for instruments not in the bot's dict
  regime_thresholds: {BTC: 0.05, ETH: 0.05, SOL: 0.05, BNB: 0.05, XRP: 0.05, ADA: 0.05,
    DOT: 0.05, LINK: 0.05, LTC: 0.08, ATOM: 0.08, NEAR: 0.08, UNI: 0.08, AAVE: 0.08,
    ARB: 0.08, OP: 0.08, INJ: 0.08, SUI: 0.08, SEI: 0.08, ZEC: 0.08, ETC: 0.08, BCH: 0.08,
    FIL: 0.08, WLD: 0.08, RUNE: 0.08}
  recalc_interval: 50
  zone_lookback: 50
  zone_body_atr: 1.2
  zone_tolerance_pct: 0.5
  vp_lookback_bars: 100
  vp_bins: 50
  vp_poc_tolerance_pct: 1.5
  fvg_min_gap_pct: 0.1
  fvg_max_age_bars: 50
  fvg_fill_threshold_pct: 80.0
  rsi_period: 14
  rsi_short_min: 55.0
  rsi_long_max: 45.0
  atr_period: 14
  min_rr: 1.5
  atr_sl_mult: 1.5
  atr_tp_mult: 3.0
  long_tp_factor: 2.0          # core LONG target = top + 2 x atr_tp_mult x ATR (asymmetric)
  volume_spike_lookback: 20
  volume_spike_multiplier: 1.5
  local_extreme_lookback: 20
  local_extreme_max_age: 3
  multiday_extreme_lookback: 100
  ema_distance_period: 20
  ema_distance_atr_multiplier: 3.0
  sl_atr_period: 14
  swing_lookback: 20
  sl_zone_buffer_atr: 0.3
  sl_swing_buffer_atr: 0.2
  tp2_atr_mult: 1.5
  partial_tp_min_rr: 1.5
  min_rr_required: 3.0
  tp1_size: 0.33
  chandelier_lookback: 10
  chandelier_atr_mult: 2.5
  cooldown_hours: 48

# ---- ITERATION-2 (DECISIONS "ITERATION-2", pre-registered 2026-11-27).
iteration2:
  resolution: 5m
  grid_score_threshold: [1.0, 2.0, 3.0]
  grid_window_bars: [2, 3]
  min_confirmed_trades: 30
  min_total_trades: 30
  gate_expectancy_r: 0.0
  gate_uplift_r: 0.15

# ---- MASTER-PLAN windows (DECISIONS "MASTER-PLAN", 2026-11-27). The hold-out is never loaded.
plan:
  a_start: 2024-12-28
  a_end: 2025-12-27
  holdout_start: 2025-12-28
  holdout_end: 2026-09-27
  b_start: 2026-09-28
  b_end: 2026-11-26
  warmup_days: 40
  min_trades: 60
  sensitivities: [default, maker_entry, slip_okx_2tick, slip_okx_4tick]
