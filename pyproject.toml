[project]
name = "flowlevels"
version = "0.1.0"
description = "Orderflow confirmation at key levels for BTC/ETH perpetuals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.9",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=13",
    "matplotlib>=3.9",
]

[project.scripts]
flowlevels = "flowlevels.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowlevels"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Markdown report rendering: long table rows and short group-frame names (T, U, ...).
"src/flowlevels/research/report.py" = ["E501", "N806"]
"src/flowlevels/research/iteration1_report.py" = ["E501", "N806"]
"src/flowlevels/research/plan.py" = ["E501", "N806"]
"src/flowlevels/strategies/*.py" = ["E501"]
"tests/test_dalton.py" = ["E501"]
"tests/test_supply_zone.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["flowlevels"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "flowlevels.config",
    "flowlevels.settings",
    "flowlevels.venues.*",
    "flowlevels.data.*",
    "flowlevels.stream.*",
    "flowlevels.footprint.*",
    "flowlevels.levels.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["network: requires real network access (skipped by default)"]
